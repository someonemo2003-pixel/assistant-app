name: Probe embedding models
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q huggingface_hub tokenizers onnxruntime numpy
      - run: python tools/probe/probe.py || true
      - name: Publish results
        if: always()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          cp probe-results.txt /tmp/r.txt || echo "no results" > /tmp/r.txt
          git checkout --orphan probe-results
          git rm -rf --cached . > /dev/null
          cp /tmp/r.txt probe-results.txt
          git add -f probe-results.txt
          git commit -m "probe results"
          git push -f origin probe-results
