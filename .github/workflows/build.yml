name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "assistant-0.1.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: مساعدي 0.1.${{ github.run_number }}
          body: "نزّل ملف الـ APK وسطّبه على موبايلك. التحديث بيحافظ على إعداداتك وذاكرتك."
          files: assistant-0.1.${{ github.run_number }}.apk
          make_latest: true

      - name: Save failure log
        if: failure()
        run: |
          { grep -nE "^e: |error:|What went wrong|FAILED|Exception" build.log | head -150; echo "-----"; tail -n 150 build.log; } > last-build.log || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f last-build.log
          git commit -m "Build ${{ github.run_number }} failed"
          git push -f origin ci-logs
