name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gemma
          key: gemma-no-gather-q4-v1

      - name: Prepare meaning-model reference data
        env:
          GEMMA_TEST_DIR: ${{ runner.temp }}/gemma
        run: |
          pip install -q huggingface_hub tokenizers onnxruntime numpy
          python tools/ci/gemma_ref.py

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GEMMA_TEST_DIR: ${{ runner.temp }}/gemma
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "assistant-0.1.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: مساعدي 0.1.${{ github.run_number }}
          body: "نزّل ملف الـ APK وسطّبه على موبايلك. التحديث بيحافظ على إعداداتك وذاكرتك."
          files: assistant-0.1.${{ github.run_number }}.apk
          make_latest: true

      - name: Save build log
        if: always()
        run: |
          { echo "status: ${{ job.status }}"; grep -nE "^e: |error:|What went wrong|FAILED|Exception|MISMATCH|tokenizer:|cos=|avg ms|alarm-vs" build.log | head -200; echo "-----"; tail -n 120 build.log; } > last-build.log || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f last-build.log
          git commit -m "Build ${{ github.run_number }} log"
          git push -f origin ci-logs
