name: Build APK

# Every push to main is only CHECKED (compile + tests). A new APK is published only for a
# major update, when a version tag like v1.0 is pushed (or the workflow is run by hand).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gemma
          key: gemma-no-gather-q4-v1

      - name: Prepare meaning-model reference data
        env:
          GEMMA_TEST_DIR: ${{ runner.temp }}/gemma
        run: |
          pip install -q huggingface_hub tokenizers onnxruntime numpy
          python tools/ci/gemma_ref.py

      - name: Detect release
        id: rel
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          v=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; fi
          if [[ -z "$v" ]]; then v=$(printf '%s' "$MSG" | grep -oE '\[release v[0-9][0-9.]*\]' | head -1 | sed -E 's/\[release (v[0-9.]+)\]/\1/' || true); fi
          if [[ -z "$v" && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then v="v0.$GITHUB_RUN_NUMBER"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.rel.outputs.version }}
          GEMMA_TEST_DIR: ${{ runner.temp }}/gemma
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "assistant-${{ steps.rel.outputs.version || github.ref_name }}.apk"

      - name: Publish release
        if: steps.rel.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nova ${{ steps.rel.outputs.version }}
          body: "نزّل ملف الـ APK وسطّبه على موبايلك. التحديث بيحافظ على إعداداتك وذاكرتك."
          files: assistant-${{ steps.rel.outputs.version }}.apk
          make_latest: true

      - name: Save build log
        if: always()
        run: |
          { echo "status: ${{ job.status }}"; grep -nE "^e: |error:|What went wrong|FAILED|Exception|MISMATCH|tokenizer:|cos=|avg ms|alarm-vs" build.log | head -200; echo "-----"; tail -n 120 build.log; } > last-build.log || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f last-build.log
          git commit -m "Build ${{ github.run_number }} log"
          git push -f origin ci-logs
